[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wafer-defect-detection"
version = "0.1.0"
description = "CNN-based multi-label defect classification"
requires-python = ">=3.11"
dependencies =[
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "prometheus-client>=0.25.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.1",
    "feast>=0.40.0",
    "s3fs>=2024.2.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "iterative-stratification>=0.1.9",
    "mlflow>=2.0.0",
    "requests>=2.31.0",
    "xgboost>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.98.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".uv-cache",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
ignore = ["E501"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_calls = false

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "hypothesis>=6.152.1",
    "optuna>=4.8.0",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "seaborn>=0.13.2",
    "types-requests>=2.33.0.20260518"
]
